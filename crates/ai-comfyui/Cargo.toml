[package]
name = "craft-ai-comfyui"
description = "ComfyUI workflow adapter and SAM 3 point, text and session clients for Craft AI. Local only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-ai-core.workspace = true
craft-ai-http.workspace = true
craft-ai-media = { path = "../ai-media", package = "craft-ai-media" }
serde.workspace = true
serde_json.workspace = true
png = "0.18"
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native shared workflow-library location; the model crate remains wasm-safe.
craft-ai-native = { path = "../ai-native", package = "craft-ai-native" }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, so a pipe given as an image or workflow file is refused instead of waited on.
libc = "0.2"
# The effective user id, so the SAM 3 lock folder is used only when this user owns it. Already in
# the tree through tempfile; this names one more of its features, not a new crate.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
tempfile = "3"
png = "0.18"
base64 = "0.23"
