[package]
name = "craft-ai-mcp"
description = "Bridge that exposes Craft AI tools as MCP tools, with dynamic discovery of new apps in the storytold org."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "craft-ai-mcp"
path = "src/main.rs"

[dependencies]
craft-ai-features.workspace = true
craft-ai-http.workspace = true
serde.workspace = true
serde_json.workspace = true
craft-ai-core.workspace = true
    craft-ai-client.workspace = true
    craft-ai-media.workspace = true
    ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
craft-ai-native.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
