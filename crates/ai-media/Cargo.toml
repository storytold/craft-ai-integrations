[package]
name = "craft-ai-media"
description = "Durable local copies of hosted provider media for Craft AI. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Link expiry dates go through chrono (no hand-rolled calendar code; CONTRIBUTING.md).
chrono = { workspace = true }
craft-ai-core.workspace = true
craft-ai-http.workspace = true
png = "0.18"
# Already in the workspace for the local engines; here it decodes JPEG and WebP results in full.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
url = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
