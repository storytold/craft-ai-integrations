[package]
name = "craft-ai-engine-candle"
description = "Built-in Candle runners for Craft AI, on this computer, native only: SAM 3 for image.segment (Meta's checkpoint) and Depth Anything V2 Small for image.depth."
version.workspace = true
edition.workspace = true
# Apache-2.0 only, not the workspace's MIT OR Apache-2.0: the SAM 3 model code is a port of
# Hugging Face Transformers (Apache-2.0). See NOTICE.
license = "Apache-2.0"
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
craft-ai-core.workspace = true
craft-ai-engine = { path = "../ai-engine", package = "craft-ai-engine" }
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
serde_json.workspace = true
thiserror = "2"
png = "0.18"
# JPEG only: the decoder (zune-jpeg) and the EXIF orientation come through this crate.
# PNG stays on the png crate above so one decoder path is not swapped for another.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# default-features = false keeps Oniguruma (a C library) out; the build stays pure Rust.
candle-core = { version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
# The Depth Anything V2 and DINOv2 network code (MIT OR Apache-2.0) comes from here, unported.
candle-transformers = { version = "=0.11.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.11.1", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.11.1", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
# Makes the JPEGs the tests decode.
jpeg-encoder = "0.7"

[lints]
workspace = true
