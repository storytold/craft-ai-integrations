[package]
name = "craft-ai-client"
description = "App-facing entry point of the Craft AI layer: resolve a role, check consent, fetch the key, start a job. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Built-in engines. Off by default so an app that does not run models itself stays light. Turning
# one on is the whole of adopting it: `ProviderFactory::standard()` then knows the engine.
candle = ["dep:craft-ai-engine-candle"]
rten = ["dep:craft-ai-engine-rten"]
burn = ["dep:craft-ai-engine-burn"]

[dependencies]
craft-ai-core.workspace = true
craft-ai-native = { path = "../ai-native", package = "craft-ai-native" }
craft-ai-openai = { path = "../ai-openai", package = "craft-ai-openai" }
craft-ai-artcraft = { path = "../ai-artcraft", package = "craft-ai-artcraft" }
craft-ai-bfl = { path = "../ai-bfl", package = "craft-ai-bfl" }
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
craft-ai-media = { path = "../ai-media", package = "craft-ai-media" }
craft-ai-comfyui = { path = "../ai-comfyui", package = "craft-ai-comfyui" }
craft-ai-comfy-env = { path = "../ai-comfy-env", package = "craft-ai-comfy-env" }
craft-ai-seedance = { path = "../ai-seedance", package = "craft-ai-seedance" }
craft-ai-vertex = { path = "../ai-vertex", package = "craft-ai-vertex" }
craft-ai-sam3 = { path = "../ai-sam3", package = "craft-ai-sam3" }
craft-ai-declarative = { path = "../ai-declarative", package = "craft-ai-declarative" }
craft-ai-engine = { path = "../ai-engine", package = "craft-ai-engine" }
craft-ai-engine-candle = { path = "../ai-engine-candle", package = "craft-ai-engine-candle", optional = true }
# The picker-preset "Released …" date goes through chrono (no hand-rolled calendar code).
chrono = { workspace = true }
craft-ai-engine-rten = { path = "../ai-engine-rten", package = "craft-ai-engine-rten", optional = true }
craft-ai-engine-burn = { path = "../ai-engine-burn", package = "craft-ai-engine-burn", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
url = "2"
png = "0.18"

[lints]
workspace = true
