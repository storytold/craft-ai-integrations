[package]
name = "craft-ai-native"
description = "Native-only pieces of the Craft AI layer: secret stores (keychain, encrypted file, environment) and the launcher's shared store on disk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
craft-ai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "7"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
keyring = "4"

[target.'cfg(windows)'.dependencies]
# Owner-only access lists for private files: the named `unsafe` exception in `src/owner_only/win_acl.rs`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
