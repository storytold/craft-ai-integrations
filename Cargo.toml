[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/craft-ai-integrations"

[workspace.dependencies]
craft-ai-core = { path = "crates/ai-core" }
craft-ai-http = { path = "crates/ai-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All date/time conversion goes through chrono (no hand-rolled calendar code; CONTRIBUTING.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
